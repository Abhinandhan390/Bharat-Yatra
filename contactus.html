<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css files/contactus.css" />
    <title>Contact Us - BharatYatra</title>
  </head>

  <body>
    <!-- CONTACT SECTION -->
    <section class="section contact-section" id="contact">
      <h2>Contact Us</h2>

      <div class="contact-container">
        <div class="contact-info">
          <h3>Get in Touch</h3>
          <p>
            <strong>📍 Address:</strong> BharatYatra Travel Pvt. Ltd.,
            Bengaluru, India
          </p>
          <p><strong>📞 Phone:</strong> +91 98765 43210</p>
          <p><strong>📧 Email:</strong> support@bharatyatra.com</p>
          <p><strong>⏰ Working Hours:</strong> 9 AM – 7 PM (Mon–Sat)</p>
        </div>

        <form class="contact-form">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" rows="5" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </section>
  </body>
</html>
